name: Build autoLoginInternet image

on:
  push:
    branches:
      - master
    paths:
      - 'autoLoginInternet/**'
      - '.github/workflows/autologininternet-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: naledao/autologininternet

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./autoLoginInternet
          file: ./autoLoginInternet/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    needs: build-and-push
    runs-on: [self-hosted, k8s, ubuntu]

    steps:
      - name: Update Kubernetes image
        run: |
          kubectl set image \
            deployment/autologininternet \
            autologininternet=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA} \
            -n campus-services

      - name: Check deployment
        run: |
          kubectl get deployment autologininternet \
            -n campus-services \
            -o wide
